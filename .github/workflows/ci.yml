name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install workspace dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests, lint, and strict type checks
        shell: pwsh
        run: ./run_tests.ps1
