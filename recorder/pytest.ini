[pytest]
testpaths = tests
# asyncio_mode=auto: بدونه تُتخطّى دوال الاختبار غير المتزامنة **بصمت** ويظلّ
# خروج pytest صفراً — أي أنّ اختباراً معطّلاً يبدو ناجحاً. (اكتُشف حين تخطّت
# ثمانية اختبارات لحلقة الشموع بلا أن تفشل المجموعة.)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# نرفض التخطّي الصامت: أي تحذير من pytest نفسه يصير خطأً.
#
# وكان هنا سطرٌ ثالث `error::pytest.PytestUnhandledCoroutineWarning`، وقد حذفت
# pytest 8.4 هذا الصنفَ من الحزمة. وتسميةُ صنفٍ غيرِ موجودٍ في `filterwarnings`
# ليست تحذيراً يُتجاوَز بل خطأُ ضبطٍ يُسقط المجموعةَ قبل جمع الاختبارات: مات
# بها هذا الملفُّ وملفُّ اللوحة على الخادم بـ AttributeError بلا أن يُجمَع
# اختبارٌ واحد. والحرسُ لم يضِع بحذفه بل قوي — في 8.4 صارت دالّةُ اختبارٍ غيرُ
# متزامنةٍ بلا مُشغّلٍ **تفشل** بنفسها ("async def functions are not natively
# supported")، أي خطأً صريحاً لا تحذيراً نحوّله نحن. والنسخةُ مثبَّتةٌ بالضبط
# في `requirements-dev.txt` فلا ترتدّ إلى ما قبل 8.4 من تلقاء نفسها.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
