[pytest]
testpaths = tests
# asyncio_mode=auto: without it, async test functions are skipped **silently**
# while pytest still exits zero — a disabled test looks like a passing one.
# (Discovered when eight candle-loop tests were skipped without the suite failing.)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# We refuse silent skipping: any warning from pytest itself becomes an error.
#
# A third line used to live here, `error::pytest.PytestUnhandledCoroutineWarning`;
# pytest 8.4 deleted that class from the package. And naming a class that does not
# exist in `filterwarnings` is not a warning to tolerate but a configuration error
# that drops the suite before collecting any tests: this file and the dashboard's
# died on the server with AttributeError without a single test collected. The
# guard was not lost by the deletion but strengthened — in 8.4 an async test
# function without a runner now **fails** on its own ("async def functions are not
# natively supported"), an explicit error rather than a warning we have to convert
# ourselves. The version is pinned exactly in `requirements-dev.txt`, so it cannot
# regress to pre-8.4 on its own.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
# curl_cffi on the Proactor loop (Windows) logs an extra reader thread — known
# behavior, not a defect in our code; silencing it keeps the `error` line above
# from turning it into a failure.
    ignore::curl_cffi.utils.CurlCffiWarning
