[pytest]
testpaths = tests
# asyncio_mode=auto: بدونه تُتخطّى دوال الاختبار غير المتزامنة **بصمت** ويظلّ
# خروج pytest صفراً — أي أنّ اختباراً معطّلاً يبدو ناجحاً. (اكتُشف حين تخطّت
# ثمانية اختبارات لحلقة الشموع بلا أن تفشل المجموعة.)
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# نرفض التخطّي الصامت: أي تحذير من pytest نفسه يصير خطأً.
filterwarnings =
    error::pytest.PytestUnhandledCoroutineWarning
    error::pytest.PytestUnraisableExceptionWarning
