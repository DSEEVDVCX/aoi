[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fomo-api"
version = "0.1.0"
description = "Unofficial read-only API for fomo.family social crypto-trading data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "playwright>=1.45",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    # REQUIRED in practice, not optional: upstream_impersonate defaults to True
    # and plain httpx gets a 403 Cloudflare challenge. _make_client falls back to
    # httpx on ImportError, so a missing curl_cffi shows up as upstream 403s
    # rather than an install error.
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# نفس مبررات ruff.toml في الجذر: E501 للتعليقات العربية،
# RUF001/002/003 تعدّ الحروف العربية «محارف ملتبسة» والمستودع ثنائي اللغة،
# وSIM105 استثناءات ضيقة مسماة لا تستحق contextlib.suppress.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]
"src/fomo_api/api/**" = ["B008"]
"src/fomo_api/auth/deps.py" = ["B008"]
"src/fomo_api/clients/deps.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/fomo_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
