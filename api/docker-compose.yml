services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      FOMO_API_REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      FOMO_API_UPSTREAM_BASE: https://fomo.family
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
