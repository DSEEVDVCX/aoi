# قواعدُ recorder/ و dashboard/. قبل هذا الملفّ لم يكن لهما ضبطٌ أصلاً — لا
# pyproject في الجذر ولا ruff.toml — فكان `ruff check` يطبّق افتراضاتِ الأداة،
# وهي تتغيّر بتغيّر نسختها: 0.15.22 تعطي صفراً، و0.16.3 تعطي 211 مخالفةً على
# الشيفرة نفسها بلا أن يتغيّر فيها سطر. أي أنّ معنى هذا الفحص كان يختاره إصدارُ
# ruff لا نحن، وترقيةٌ صامتةٌ تكفي لتصبيغ اللوحة بالأحمر.
#
# والمجموعةُ أدناه هي نفسُها التي كانت تُنفَّذ فعلاً (افتراضاتُ ruff الكلاسيكيّة)
# مكتوبةً صراحةً لتَثبُت: صفرُ مخالفاتٍ اليوم، وصفرٌ بعد أيّ ترقيةٍ لاحقة.
#
# وهي أضيقُ من مجموعة `api/pyproject.toml` (E,F,I,UP,B,SIM,RUF) عن قصدٍ لا سهو:
# قياسُها على هذين المجلّدين أعطى ~440 مخالفة، منها ~170 من RUF001/002/003 التي
# تَعُدّ الحروفَ العربيّةَ نفسَها «ملتبسة» في التعليقات والنصوص، و49 من I001 في
# ملفّاتٍ تكتب `sys.path.insert` قبل استيراد `db`/`config` — وإعادةُ ترتيبها
# خطرٌ لا يظهر إلّا عند إعادة تشغيل مهمّةٍ طويلة. رفعُ المجلّدين إلى مجموعة
# api/ عملٌ مقصودٌ يُقاس ويُختبر وحده، لا أثرٌ جانبيّ لإصلاح فحصٍ أحمر.
#
# ولا يمسّ هذا الملفُّ api/: ruff يأخذ أقربَ ضبطٍ إلى الملفّ، و`api/pyproject.toml`
# أقربُ إلى ملفّاتها من جذر المستودَع.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
