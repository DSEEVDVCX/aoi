# Rules for recorder/ and dashboard/. Before this file they had no configuration
# at all — no pyproject at the root and no ruff.toml — so `ruff check` applied
# the tool's defaults, which change with its version: 0.15.22 gives zero
# violations and 0.16.3 gives 211 on the same code without a single line
# changing. In other words, the meaning of this check was chosen by the ruff
# release, not by us, and a silent upgrade is enough to paint the dashboard red.
#
# The rule set is now the same as `api/pyproject.toml`'s (E,F,I,UP,B,SIM,RUF)
# plus BLE, so the repository has one standard, not two. A narrower set used to
# live here (E4,E7,E9,F), justified by the upgrade touching 440 violations, 49
# of them I001 in files that write `sys.path.insert` before importing
# `db`/`config`, where reordering is a risk that only shows up when a
# long-running task restarts. Measurement killed the argument: not one I001
# file writes `sys.path.insert` in the first place, and ruff's isort fix
# reorders within the contiguous block and never moves an import above an
# executable statement, so the dangerous move is not something the tool does.
# After exempting the files below, violations dropped to 133 from 440.
#
# The ignores are three kinds, not one:
#
#   E501: line length here is 100 as in api/, but Arabic gets counted by
#         characters, not visual width, so comments measure longer than they
#         look. (No longer applicable after the English translation; kept
#         harmless.)
#
#   RUF001/002/003: they count Arabic letters themselves as "ambiguous
#         characters" — around 170 violations in deliberately Arabic comments
#         and strings. The rule guards a single language, and this repository
#         used to write its comments in two. (Kept harmless after the English
#         translation.)
#
#   SIM105: asks for `contextlib.suppress` instead of `try/except/pass`. All
#         28 sites are already narrow named exceptions
#         (`except (AttributeError, OSError)`), not `except Exception`, so the
#         rule sells style, not safety; converting them adds an import in ten
#         files and slows a path that runs every cycle, with no behavioral
#         difference.
#
# BLE is added on top of the api/ set because the code asks for it itself:
# there are eleven `# noqa: BLE001` in the tree with written reasons ("one
# coin must not take down the cycle"), so they are written against a standard
# that sees broad exceptions. Dropping BLE flips those reasons into RUF100
# "unused noqa" and demands their removal: measurement gave 207 violations
# without BLE and 161 with it — the stricter guard is the quieter one here.
# Every remaining broad site is annotated beside it; a new unannotated one
# fails the check.
#
# This file does not affect api/: ruff takes the configuration nearest the
# file, and `api/pyproject.toml` is nearer to its files than the repo root.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105"]

# A **temporary** exception, not a permanent one. These files carry uncommitted
# work by another agent running right now (their last write came after my last
# commit), and they hold 24 violations that already exist in the committed
# version — measured in a worktree of HEAD, also exactly 24 — so that agent's
# edits introduced not one violation. They were left unfixed because fixing
# them means writing to a file someone else has open: one of the two writes is
# lost, and committing them would carry their unfinished work under my name.
#
# Whoever commits that work: delete its line here and fix its violations — the
# rule is written beside each one, so the work's size is known. A line
# remaining here means a file that passes the check without being checked,
# which is exactly the defect this file was written to prevent.
[lint.per-file-ignores]
"dashboard/tests/test_app_guards.py" = ["I001", "RUF100"]
"dashboard/tests/test_dao.py" = ["I001"]
"recorder/backfill_thesis.py" = ["BLE001"]
"recorder/config.py" = ["RUF100"]
"recorder/evm_layer.py" = ["UP009", "UP035"]
"recorder/evm_replay.py" = ["B905", "RUF046", "UP009", "UP035"]
"recorder/run_chain.py" = ["BLE001", "I001", "RUF100", "UP009"]
"recorder/run_evm_replay.py" = ["I001"]
"recorder/tests/test_evm_replay.py" = ["I001"]
"recorder/tests/test_run_evm_replay.py" = ["RUF100"]
# The archive of field-diagnostic scripts (295 probe_* files moved here on
# 2026-08-29 from recorder/'s root after their tasks ended). These are
# measurements written for one question and then finished — not production code
# and never imported: an archive read for history, not to be run. Fixing 691
# violations in it (mostly E401/I001) would inject noise into a record that
# should stay as written on measurement day. Whoever revives one of these
# scripts: copy it to recorder/ and fix it there.
"recorder/probes/*" = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

