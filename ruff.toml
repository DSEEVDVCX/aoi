# قواعدُ recorder/ و dashboard/. قبل هذا الملفّ لم يكن لهما ضبطٌ أصلاً — لا
# pyproject في الجذر ولا ruff.toml — فكان `ruff check` يطبّق افتراضاتِ الأداة،
# وهي تتغيّر بتغيّر نسختها: 0.15.22 تعطي صفراً، و0.16.3 تعطي 211 مخالفةً على
# الشيفرة نفسها بلا أن يتغيّر فيها سطر. أي أنّ معنى هذا الفحص كان يختاره إصدارُ
# ruff لا نحن، وترقيةٌ صامتةٌ تكفي لتصبيغ اللوحة بالأحمر.
#
# والمجموعةُ الآن هي مجموعةُ `api/pyproject.toml` نفسُها (E,F,I,UP,B,SIM,RUF)
# وفوقها BLE، فيصير للمستودَع معيارٌ واحدٌ لا معياران. وكانت هنا مجموعةٌ أضيقُ
# (E4,E7,E9,F) حُجّتُها أنّ الرفعَ يمسّ 440 مخالفةً منها 49 من I001 في ملفّاتٍ
# تكتب `sys.path.insert` قبل استيراد `db`/`config`، وإعادةُ ترتيبها خطرٌ لا يظهر
# إلّا عند إعادة تشغيل مهمّةٍ طويلة. والقياسُ أسقط الحُجّة: لا ملفَّ واحدَ من
# ملفّات I001 يكتب `sys.path.insert` أصلاً، وإصلاحُ isort في ruff يرتّب داخل
# الكتلة المتّصلة ولا ينقل استيراداً فوق جملةٍ تنفيذيّة، فالنقلُ الخطِرُ ليس مما
# تفعله الأداة. وبعد استثناءِ ما دونه صارت المخالفاتُ 133 لا 440.
#
# والمستثنى ثلاثةُ أنواعٍ لا نوعٌ واحد:
#
#   E501: الطولُ هنا 100 كما في api/، لكنّ العربيّةَ تُحسَب بالمحارف لا بالعرض
#         المرئيّ فتُقاس التعليقاتُ أطولَ مما تُرى.
#
#   RUF001/002/003: تَعُدّ الحروفَ العربيّةَ نفسَها «محارفَ ملتبسة» — نحو 170
#         مخالفةً في تعليقاتٍ ونصوصٍ عربيّةٍ مقصودة. القاعدةُ تحرس لغةً واحدةً
#         وهذا المستودَع يكتب تعليقاتَه بلغتين.
#
#   SIM105: تطلب `contextlib.suppress` بدلاً من `try/except/pass`. والثمانيةُ
#         والعشرونَ موضعاً كلُّها استثناءاتٌ ضيّقةٌ مسمّاةٌ أصلاً
#         (`except (AttributeError, OSError)`) لا `except Exception`، فالقاعدةُ
#         تبيع أسلوباً لا أماناً؛ وتحويلُها يزيد استيراداً في عشرة ملفّاتٍ
#         ويُبطئ مساراً يُنفَّذ كلَّ دورة، بلا فارقٍ في السلوك.
#
# وBLE مُضافةٌ فوق مجموعة api/ لأنّ الشيفرةَ تطلبها بنفسها: في الشجرة أحدَ عشرَ
# `# noqa: BLE001` بأسبابٍ مكتوبةٍ («عملةٌ واحدةٌ لا تُسقط الدورة»)، فهي مكتوبةٌ
# على معيارٍ يرى الاستثناءَ العريض. وبإسقاط BLE تنقلب تلك الأسبابُ إلى RUF100
# «noqa غير مستعمَل» فيُطلب حذفُها: القياسُ أعطى 207 مخالفةً بلا BLE و161 معها،
# أي أنّ الحرسَ الأشدَّ هو الأقلُّ ضجيجاً هنا. وكلُّ موضعٍ عريضٍ باقٍ صار مُعلَّلاً
# بجانبه؛ والجديدُ غيرُ المُعلَّل يسقط في الفحص.
#
# ولا يمسّ هذا الملفُّ api/: ruff يأخذ أقربَ ضبطٍ إلى الملفّ، و`api/pyproject.toml`
# أقربُ إلى ملفّاتها من جذر المستودَع.
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105"]

# استثناءٌ **مؤقّت** لا دائم. هذه الملفّات فيها عملٌ غيرُ مُلتزَمٍ لوكيلٍ آخرَ
# يعمل الآن (آخرُ كتابةٍ فيها كانت بعد آخرِ التزامٍ لي)، وفيها 24 مخالفةً
# موجودةً في النسخة المُلتزَمة أصلاً — قِستُها في مرآةٍ من HEAD فكانت 24 نفسَها،
# أي أنّ تعديلاتِه لم تُدخل مخالفةً واحدة. ولم أُصلحها لأنّ إصلاحَها يقتضي
# الكتابةَ في ملفٍّ مفتوحٍ عند غيري: تُفقَد إحدى الكتابتين، ولأنّ الالتزامَ بها
# يحمل عملَه الناقصَ في التزامٍ باسمي.
#
# فمَن التزم ذلك العملَ: احذف سطرَه من هنا وأصلح مخالفاتِه — القاعدةُ مكتوبةٌ
# بجانبها فالعملُ معروفُ الحجم. وبقاءُ السطر يعني ملفّاً يمرّ الفحصَ بلا أن
# يُفحَص، وهو بالضبط العطبُ الذي كتبتُ هذا الملفَّ لأمنعه.
[lint.per-file-ignores]
"dashboard/tests/test_app_guards.py" = ["I001", "RUF100"]
"dashboard/tests/test_dao.py" = ["I001"]
"recorder/backfill_thesis.py" = ["BLE001"]
"recorder/config.py" = ["RUF100"]
"recorder/evm_layer.py" = ["UP009", "UP035"]
"recorder/evm_replay.py" = ["B905", "RUF046", "UP009", "UP035"]
"recorder/run_chain.py" = ["BLE001", "I001", "RUF100", "UP009"]
"recorder/run_evm_replay.py" = ["I001"]
"recorder/tests/test_evm_replay.py" = ["I001"]
"recorder/tests/test_run_evm_replay.py" = ["RUF100"]
# أرشيفُ سكربتات التشخيص الميدانيّة (295 سكربت probe_* نُقلت هنا 2026-08-29 من
# جذر recorder/ بعد انتهاء مهمّاتها). هذه قياساتٌ خُطّت لسؤالٍ واحدٍ ثم انتهت —
# ليست شيفرةَ إنتاجٍ ولا تُستورَد: أرشيفٌ يُقرأ للتاريخ لا ليُشغَّل. إصلاحُ
# 691 مخالفةً فيها (E401/I001 في الغالب) يُدخل ضجيجاً في سجلٍّ يريد أن يبقى
# كما كُتب يوم القياس. مَن يُحيي سكربتاً منها: انسخه إلى recorder/ وأصلحه هناك.
"recorder/probes/*" = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]

