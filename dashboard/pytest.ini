[pytest]
testpaths = tests
# نفس سبب recorder/pytest.ini: بلا asyncio_mode=auto تُتخطّى الاختبارات غير
# المتزامنة بصمت وتظلّ المجموعة "ناجحة".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error::pytest.PytestUnhandledCoroutineWarning
    error::pytest.PytestUnraisableExceptionWarning
