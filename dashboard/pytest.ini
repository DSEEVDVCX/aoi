[pytest]
testpaths = tests
# Same reason as recorder/pytest.ini: without asyncio_mode=auto, non-async
# tests are silently skipped and the suite still looks "green".
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# And `PytestUnhandledCoroutineWarning` was removed because pytest 8.4 dropped it
# from the package, so mentioning it became a config error that fails the suite;
# details in `recorder/pytest.ini`.
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
